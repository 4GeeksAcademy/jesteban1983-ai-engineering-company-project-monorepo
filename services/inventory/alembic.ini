# ============================================
# alembic.ini - Configuración de Alembic para migraciones
# ============================================
# Alembic es una herramienta que gestiona cambios en la base de datos.
# 
# ¿Para qué sirve?
# - Cuando cambias los modelos (ej: añadir columna), Alembic genera 
#   el código SQL para actualizar la BD sin perder datos.
#
# Comandos básicos:
# - alembic revision --autogenerate -m "descripcion" → genera migración
# - alembic upgrade head → aplica la migración más reciente
# - alembic downgrade -1 → deshace la última migración
#
# La URL de la BD se puede pasar como variable de entorno:
# alembic -x db_url="postgresql+asyncpg://..." upgrade head

[alembic]
# Ruta del directorio de migraciones
script_location = alembic

# La URL de la BD se configura AQUÍ para desarrollo local.
# En producción se sobreescribe desde env.py usando DATABASE_URL
sqlalchemy.url = sqlite+aiosqlite:///./dev.db

# Los archivos de migración se llaman como este template
file_template = %%(rev)s_%%(slug)s

# Formato de fecha en los logs
# timezone = UTC

# Ubicación de los modelos de SQLAlchemy
# (se configura en alembic/env.py)
# prepend_sys_path = .

# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S