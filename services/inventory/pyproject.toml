# ============================================
# pyproject.toml - Metadatos del proyecto
# ============================================
# Este archivo define metadatos del proyecto Python.
# Es el estándar moderno (PEP 621) para configurar proyectos.
# Sustituye a setup.py, setup.cfg, requirements.txt, etc.

[project]
name = "trackflow-inventory-api"
version = "1.0.0"
description = "Backend REST API para gestión de inventario con SQLAlchemy ORM y doble base de datos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TrackFlow Team"},
]

# Dependencias del proyecto
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.35.0",
    "python-dotenv>=1.0.0",
]

# Dependencias opcionales de desarrollo
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

# Configuración de herramientas
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]